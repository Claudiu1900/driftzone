<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone Clothes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <div class="top-line"></div>

        <div class="left-panel">
            <div class="brand">
                <div class="logo">DZ</div>
                <div>
                    <h1>DRIFTZONE CLOTHES</h1>
                    <p>Admin clothing editor</p>
                </div>
            </div>

            <div class="access-badge">ADMIN 7 • ADUTY YES</div>

            <div id="items" class="items"></div>
        </div>

        <div id="characterZone" class="character-zone">
            <div class="zone-label">Ține click pe caracter pentru rotire • Scroll pentru zoom</div>
            <div class="scan scan-a"></div>
            <div class="scan scan-b"></div>
        </div>

        <div class="bottom-actions">
            <button class="save-btn" onclick="saveClothes()">SALVEAZA</button>
            <button class="abandon-btn" onclick="abandonClothes()">ABANDONEAZA</button>
        </div>

        <div class="bottom-glow"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
