<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Player Interact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="app hidden">
        <section id="selectorView" class="selector-view hidden"></section>

        <section id="menuView" class="menu-view hidden">
            <div class="player-box">
                <span>PLAYER</span>
                <b id="playerName">Player</b>
                <small>ID <em id="playerId">0</em></small>
            </div>
            <button id="payAction" class="pay-action" onclick="openPay()">PAY</button>
        </section>

        <section id="payView" class="pay-view hidden">
            <div class="pay-shell">
                <div class="pay-head">
                    <span>PAY</span>
                    <h1>Transfer cash</h1>
                    <p>Catre <b id="payTargetName">Player</b> <small>ID <em id="payTargetId">0</em></small></p>
                </div>

                <div class="amount-card">
                    <label for="amountInput">Suma cash</label>
                    <input id="amountInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="50000" autocomplete="off">
                    <div class="quick-values">
                        <button onclick="quickAmount(10000)">$10,000</button>
                        <button onclick="quickAmount(50000)">$50,000</button>
                        <button onclick="quickAmount(100000)">$100,000</button>
                    </div>
                    <div id="payError" class="pay-error hidden"></div>
                </div>

                <button id="confirmPay" class="confirm" onclick="confirmPay()">
                    <span>CONFIRM TRANSFER</span>
                    <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
