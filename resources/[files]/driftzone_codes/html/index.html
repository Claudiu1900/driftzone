<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone Codes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <div class="panel">
            <button class="close" onclick="closeUi()">×</button>

            <div class="brand">
                <div class="logo">DZ</div>
                <div>
                    <h1>Redeem Code</h1>
                    <p>Scrie codul primit pentru a revendica recompensa.</p>
                </div>
            </div>

            <div class="code-box">
                <label>CODE</label>
                <input id="codeInput" autocomplete="off" spellcheck="false" maxlength="64" placeholder="Scrie codul aici">
                <div class="hint">Paste este blocat. Codul trebuie scris manual.</div>
            </div>

            <button id="redeemBtn" class="redeem" onclick="redeemCode()">REDEEM</button>

            <div id="result" class="result hidden"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
