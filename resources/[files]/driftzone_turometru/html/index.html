<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Turometru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="speedometer" class="speedometer hidden">
        <div class="speed-wrap">
            <svg class="gauge" viewBox="0 0 260 160" aria-hidden="true">
                <defs>
                    <linearGradient id="arcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
                        <stop offset="58%" stop-color="#04c7f7" stop-opacity="0.98"/>
                        <stop offset="100%" stop-color="#ff3a3a" stop-opacity="1"/>
                    </linearGradient>

                    <filter id="arcGlow">
                        <feGaussianBlur stdDeviation="2.5" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <path class="arc-bg" d="M 38 126 A 92 92 0 0 1 222 126"/>
                <path id="speedArc" class="arc-main" d="M 38 126 A 92 92 0 0 1 222 126"/>

                <g class="ticks">
                    <line x1="42" y1="126" x2="52" y2="126"/>
                    <line x1="61" y1="75" x2="69" y2="81"/>
                    <line x1="106" y1="39" x2="109" y2="49"/>
                    <line x1="154" y1="39" x2="151" y2="49"/>
                    <line x1="199" y1="75" x2="191" y2="81"/>
                    <line x1="218" y1="126" x2="208" y2="126"/>
                </g>
            </svg>

            <div class="center">
                <div id="gearValue" class="gear">N</div>
                <div class="speed-line">
                    <span id="speedValue" class="speed">0</span>
                    <span class="unit">KM/H</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
