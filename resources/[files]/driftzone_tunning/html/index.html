<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Tunning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="root" class="root hidden">
        <section class="hero">
            <div class="brand">
                <div class="mark">DZ</div>
                <div>
                    <h1>DRIFTZONE TUNNING</h1>
                    <p id="vehicleInfo">Vehicle</p>
                </div>
            </div>
            <div class="stats">
                <div><span>CASH</span><b id="money">$0</b></div>
                <div><span>MODE</span><b id="modeText">OWNER</b></div>
            </div>
        </section>

        <section class="layout">
            <aside class="groups">
                <div class="panel-title">GROUPS</div>
                <div id="groups"></div>
            </aside>

            <aside class="categories-panel">
                <div class="panel-title">CATEGORIES</div>
                <input id="search" class="search" placeholder="Search tuning..." oninput="renderCategories()">
                <div id="categories" class="categories"></div>
            </aside>

            <section class="options-panel">
                <div class="option-head">
                    <div>
                        <span>SELECTED</span>
                        <h2 id="selectedTitle">Selecteaza o categorie</h2>
                    </div>
                    <button class="ghost" onclick="nui('toggleCamera')">CAMERA `</button>
                </div>
                <div id="options" class="options empty-state">
                    <b>Alege o categorie</b>
                    <span>Vor apărea doar modificările reale disponibile pe mașina curentă.</span>
                </div>
            </section>

            <aside class="cart-panel">
                <div class="cart-head">
                    <div>
                        <span>CART</span>
                        <b id="cartCount">0 items</b>
                    </div>
                    <b id="totalPrice">$0</b>
                </div>
                <div id="cartItems" class="cart-items"></div>
                <div class="actions">
                    <button class="pay" onclick="pay()">PAY & APPLY</button>
                    <button class="cancel" onclick="closeMenu()">CANCEL</button>
                </div>
                <div class="hint">ESC anulează • ` camera liberă • fără chameleon colors</div>
            </aside>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
