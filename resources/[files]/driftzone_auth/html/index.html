<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <div class="ambient ambient-a"></div>
        <div class="ambient ambient-b"></div>

        <div class="panel">
            <div class="brand">
                <div class="logo">DZ</div>
                <div>
                    <h1 id="title">DRIFTZONE</h1>
                    <p id="subtitle">Secure identity access</p>
                </div>
            </div>

            <div class="field">
                <label>Identity</label>
                <input type="text" id="username" readonly>
            </div>

            <div id="registerFields" class="register-fields hidden">
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="user@driftzone.ro">
                </div>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
                <button class="eye" onclick="togglePassword('password', this)">SHOW</button>
            </div>

            <div id="confirmFields" class="register-fields hidden">
                <div class="field">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••">
                    <button class="eye" onclick="togglePassword('confirmPassword', this)">SHOW</button>
                </div>
            </div>

            <label id="rememberRow" class="remember-row">
                <input type="checkbox" id="remember">
                <span>Remember Me</span>
            </label>

            <button id="submitBtn" class="submit-btn" onclick="submitAuth()">LOG IN</button>

            <div id="message" class="message hidden"></div>

            <button id="switchBtn" class="switch-btn" onclick="switchMode()">New Account? Register</button>
        </div>

        <div class="bottom-line"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
