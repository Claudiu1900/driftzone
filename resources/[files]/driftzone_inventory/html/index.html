<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="inventoryRoot" class="inventory-root hidden">
        <section id="clothingShell" class="clothing-shell">
            <div class="clothing-title">CLOTHES</div>
            <div class="body-equipment">
                <img class="body-outline" src="icons/body.svg" draggable="false" alt="Body">
                <div id="clothingSlots" class="clothing-slots"></div>
            </div>
            <div class="clothing-hint">Trage hainele pe slotul corect</div>
        </section>

        <div class="inventory-stack">
            <section id="moneyShell" class="currency-shell hidden">
                <div id="moneyPanel" class="money-panel"></div>
            </section>

            <section class="inventory-shell">
                <div id="grid" class="inventory-grid"></div>
            </section>

            <section id="quickShell" class="quick-shell">
                <div id="quickBar" class="quick-bar"></div>
            </section>
        </div>

        <aside id="droppedPanel" class="dropped-panel hidden">
            <div id="droppedList" class="dropped-list"></div>
        </aside>

        <div id="contextMenu" class="context-menu hidden">
            <div id="contextName" class="context-name">Item</div>
            <button id="ctxUse" onclick="useSelected()">USE</button>
            <button id="ctxGive" onclick="startGiveSelect()">GIVE</button>
            <button id="ctxDrop" onclick="dropSelected()">DROP</button>
        </div>

        <div id="amountModal" class="amount-modal hidden">
            <div id="amountTitle" class="amount-title">AMOUNT</div>
            <input id="amountRange" class="amount-range" type="range" min="1" max="1" value="1" oninput="syncAmountFromRange()">
            <div class="amount-row">
                <button onclick="setAmountMin()">MIN</button>
                <input id="amountInput" type="number" min="1" value="1" oninput="syncAmountFromInput()">
                <button onclick="setAmountMax()">MAX</button>
            </div>
            <div id="amountMax" class="amount-max">MAX 1</div>
            <div class="amount-actions">
                <button onclick="cancelAmount()">CANCEL</button>
                <button class="amount-confirm" onclick="confirmAmount()">OK</button>
            </div>
        </div>
    </main>

    <main id="selectorRoot" class="selector-root hidden"></main>

    <main id="addItemRoot" class="add-root hidden">
        <section class="add-shell">
            <div class="add-title">ADD ITEM</div>
            <div class="form-grid">
                <label>Item ID<input id="itemId" placeholder="water"></label>
                <label>Item Name<input id="itemName" placeholder="Apă"></label>
                <label class="wide">Image<input id="itemImage" placeholder="https://..." oninput="previewImage()"></label>
                <label>Tradable<select id="itemTradable"><option value="1">1</option><option value="0">0</option></select></label>
                <label>Stackable<select id="itemStackable"><option value="1">1</option><option value="0">0</option></select></label>
                <label>Usable<select id="itemUsable"><option value="0">0</option><option value="1">1</option></select></label>
                <label>Giveable<select id="itemGiveable"><option value="1">1</option><option value="0">0</option></select></label>
                <label>Max Stack<input id="itemMaxStack" type="number" min="1" value="100"></label>
                <label>Gradient Item<select id="itemIsGradient" onchange="toggleGradientItem()"><option value="0">0</option><option value="1">1</option></select></label>
                <label>Gradient ID<input id="itemGradientId" type="number" min="0" value="0" oninput="syncGradientItemId()"></label>
            </div>
            <div id="imagePreview" class="image-preview hidden"><img id="previewImg"></div>
            <div id="addStatus" class="add-status">Completează itemul.</div>
            <div class="add-buttons">
                <button class="save-btn" onclick="submitAddItem()">SAVE ITEM</button>
                <button class="ghost-btn" onclick="closeUi()">CLOSE</button>
            </div>
        </section>
    </main>

    <main id="addClothesRoot" class="add-root hidden">
        <section class="add-shell clothes-add-shell">
            <div class="add-title">ADD CLOTHES ITEM</div>
            <div class="form-grid">
                <label>Clothes Category<select id="clothesCategory"></select></label>
                <label>Clothes ID / Drawable<input id="clothesDrawable" type="number" min="-1" value="0"></label>
                <label>Texture<input id="clothesTexture" type="number" min="0" value="0"></label>
                <label>Item ID<input id="clothesItemId" placeholder="clothes1"></label>
                <label>Item Name<input id="clothesItemName" placeholder="Black Jacket"></label>
                <label class="wide">Image<input id="clothesItemImage" placeholder="https://..." oninput="previewClothesImage()"></label>
                <label>Tradable<select id="clothesTradable"><option value="1">1</option><option value="0">0</option></select></label>
                <label>Stackable<select id="clothesStackable"><option value="0">0</option><option value="1">1</option></select></label>
                <label>Usable<select id="clothesUsable"><option value="1">1</option><option value="0">0</option></select></label>
                <label>Giveable<select id="clothesGiveable"><option value="1">1</option><option value="0">0</option></select></label>
                <label>Max Stack<input id="clothesMaxStack" type="number" min="1" value="1"></label>
            </div>
            <div id="clothesImagePreview" class="image-preview hidden"><img id="clothesPreviewImg"></div>
            <div id="clothesStatus" class="add-status">Completează haina.</div>
            <div class="add-buttons">
                <button class="save-btn" onclick="submitAddClothes()">SAVE CLOTHES</button>
                <button class="ghost-btn" onclick="closeUi()">CLOSE</button>
            </div>
        </section>
    </main>

    <main id="itemsRoot" class="items-root hidden">
        <section class="items-shell">
            <div class="items-header">
                <div>
                    <div class="items-title">ITEMS</div>
                    <div class="items-subtitle">Admin panel pentru inventory_items</div>
                </div>
                <button class="items-close" onclick="closeUi()">CLOSE</button>
            </div>

            <div class="items-layout">
                <aside class="items-list-wrap">
                    <input id="itemsSearch" class="items-search" placeholder="Cauta item..." oninput="renderAdminItemsList()">
                    <div id="itemsList" class="items-list"></div>
                </aside>

                <section class="items-editor">
                    <div class="items-editor-title">EDIT ITEM</div>
                    <input id="adminOriginalItemId" type="hidden">
                    <div class="form-grid">
                        <label>Item ID<input id="adminItemId" placeholder="water" readonly></label>
                        <label>Item Name<input id="adminItemName" placeholder="Apă"></label>
                        <label class="wide">Image<input id="adminItemImage" placeholder="https://..." oninput="previewAdminImage()"></label>
                        <label>Tradable<select id="adminItemTradable"><option value="1">1</option><option value="0">0</option></select></label>
                        <label>Stackable<select id="adminItemStackable"><option value="1">1</option><option value="0">0</option></select></label>
                        <label>Usable<select id="adminItemUsable"><option value="0">0</option><option value="1">1</option></select></label>
                        <label>Giveable<select id="adminItemGiveable"><option value="1">1</option><option value="0">0</option></select></label>
                        <label>Max Stack<input id="adminItemMaxStack" type="number" min="1" value="100"></label>
                        <label>Gradient Item<select id="adminItemIsGradient" onchange="toggleAdminGradientItem()"><option value="0">0</option><option value="1">1</option></select></label>
                        <label>Gradient ID<input id="adminItemGradientId" type="number" min="0" value="0" oninput="syncAdminGradientItemId()"></label>
                    </div>
                    <div id="adminImagePreview" class="image-preview hidden"><img id="adminPreviewImg"></div>
                    <div id="itemsStatus" class="add-status">Selecteaza un item din lista.</div>
                    <div class="add-buttons">
                        <button class="save-btn" onclick="submitAdminItem()">SAVE CHANGES</button>
                        <button class="ghost-btn" onclick="closeUi()">CLOSE</button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <main id="clothesItemsRoot" class="items-root hidden">
        <section class="items-shell clothes-items-shell">
            <div class="items-header">
                <div>
                    <div class="items-title">CLOTHES ITEMS</div>
                    <div class="items-subtitle">Admin panel pentru clothes_items</div>
                </div>
                <button class="items-close" onclick="closeUi()">CLOSE</button>
            </div>

            <div class="items-layout">
                <aside class="items-list-wrap">
                    <select id="clothesItemsFilter" class="items-search" onchange="renderAdminClothesList()"><option value="all">All categories</option></select>
                    <input id="clothesItemsSearch" class="items-search" placeholder="Cauta haina..." oninput="renderAdminClothesList()">
                    <div id="clothesItemsList" class="items-list"></div>
                </aside>

                <section class="items-editor">
                    <div class="items-editor-title">EDIT CLOTHES</div>
                    <input id="adminOriginalClothesId" type="hidden">
                    <div class="form-grid">
                        <label>Item ID<input id="adminClothesItemId" placeholder="clothes1" readonly></label>
                        <label>Item Name<input id="adminClothesItemName" placeholder="Black Jacket"></label>
                        <label>Category<select id="adminClothesCategory"></select></label>
                        <label>Drawable<input id="adminClothesDrawable" type="number" min="-1" value="0"></label>
                        <label>Texture<input id="adminClothesTexture" type="number" min="0" value="0"></label>
                        <label class="wide">Image<input id="adminClothesImage" placeholder="https://..." oninput="previewAdminClothesImage()"></label>
                        <label>Tradable<select id="adminClothesTradable"><option value="1">1</option><option value="0">0</option></select></label>
                        <label>Stackable<select id="adminClothesStackable"><option value="0">0</option><option value="1">1</option></select></label>
                        <label>Usable<select id="adminClothesUsable"><option value="1">1</option><option value="0">0</option></select></label>
                        <label>Giveable<select id="adminClothesGiveable"><option value="1">1</option><option value="0">0</option></select></label>
                        <label>Max Stack<input id="adminClothesMaxStack" type="number" min="1" value="1"></label>
                    </div>
                    <div id="adminClothesImagePreview" class="image-preview hidden"><img id="adminClothesPreviewImg"></div>
                    <div id="clothesItemsStatus" class="add-status">Selecteaza o haina din lista.</div>
                    <div class="add-buttons">
                        <button class="save-btn" onclick="submitAdminClothesItem()">SAVE CHANGES</button>
                        <button class="ghost-btn" onclick="closeUi()">CLOSE</button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
