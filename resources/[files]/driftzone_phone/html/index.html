<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Phone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="phoneRoot" class="phone-root hidden">
        <div class="phone-frame">
            <div class="notch"><span></span></div>
            <div class="statusbar"><b id="statusTime">12:00</b><span>5G</span></div>

            <section id="homeScreen" class="screen home-screen"></section>
            <section id="dialScreen" class="screen app-screen hidden"></section>
            <section id="contactsScreen" class="screen app-screen hidden"></section>
            <section id="callsScreen" class="screen app-screen hidden"></section>
            <section id="messagesScreen" class="screen app-screen hidden"></section>
            <section id="conversationScreen" class="screen app-screen hidden"></section>
            <section id="callScreen" class="screen call-screen hidden"></section>
            <section id="peekScreen" class="screen peek-screen hidden"></section>

            <button id="homeBar" class="home-bar" onclick="homeBarAction()"></button>
        </div>
    </div>

    <audio id="ringSound" src="assets/sounds/ring.mp3" loop preload="auto"></audio>
    <audio id="ring2Sound" src="assets/sounds/ring2.mp3" loop preload="auto"></audio>
    <audio id="declineSound" src="assets/sounds/decline.mp3" preload="auto"></audio>
    <audio id="messageSound" src="assets/sounds/message.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
