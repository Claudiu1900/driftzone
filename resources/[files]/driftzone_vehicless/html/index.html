<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Vehicle Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="root" class="root hidden">
        <section class="panel">
            <div class="glow glow-a"></div>
            <div class="glow glow-b"></div>
            <div class="top-line"></div>

            <header class="head">
                <div class="logo">DZ</div>
                <div class="title-box">
                    <span>VEHICLE STUDIO</span>
                    <h1 id="modelName">Alege modelul</h1>
                </div>
            </header>

            <section class="load-card">
                <div class="label-row">
                    <label>MODEL VEHICLE</label>
                    <small>/vehss sau /vehss model</small>
                </div>
                <div class="load-row">
                    <input id="modelInput" placeholder="ex: s15, supra, rmodm4" spellcheck="false" autocomplete="off">
                    <button id="loadBtn" onclick="loadModel()">LOAD</button>
                </div>
                <div id="statusText" class="status-text">Scrie modelul si apasa Enter sau LOAD.</div>
            </section>

            <section id="emptyBox" class="empty-box">
                <div class="empty-icon">+</div>
                <div>
                    <b>Nicio masina incarcata</b>
                    <p>Pune modelul masinii ca sa o incarci in studio.</p>
                </div>
            </section>

            <section id="studioControls" class="studio-controls disabled">
                <div class="stats">
                    <div><label>ROTATION</label><b id="rotationValue">45°</b></div>
                    <div><label>FOV</label><b id="fovValue">47</b></div>
                    <div><label>DISTANCE</label><b id="distanceValue">7.2</b></div>
                    <div><label>HEIGHT</label><b id="heightValue">1.1</b></div>
                </div>

                <div class="group">
                    <div class="group-title">ROTIRE MASINA</div>
                    <div class="row two">
                        <button onclick="control('rotate_left')">⟲ LEFT</button>
                        <button onclick="control('rotate_right')">RIGHT ⟳</button>
                    </div>
                    <button id="autoBtn" class="wide ghost" onclick="control('auto_rotate')">AUTO ROTATE OFF</button>
                </div>

                <div class="group">
                    <div class="group-title">CAMERA</div>
                    <div class="row two">
                        <button onclick="control('fov_down')">FOV -</button>
                        <button onclick="control('fov_up')">FOV +</button>
                    </div>
                    <div class="row two">
                        <button onclick="control('distance_down')">ZOOM IN</button>
                        <button onclick="control('distance_up')">ZOOM OUT</button>
                    </div>
                    <div class="row two">
                        <button onclick="control('height_down')">CAM LOW</button>
                        <button onclick="control('height_up')">CAM HIGH</button>
                    </div>
                    <div class="row two">
                        <button onclick="control('look_down')">LOOK LOW</button>
                        <button onclick="control('look_up')">LOOK HIGH</button>
                    </div>
                </div>

                <div class="group">
                    <div class="group-title">DETALII</div>
                    <div class="row two">
                        <button id="lightsBtn" onclick="control('lights')">LIGHTS ON</button>
                        <button id="doorsBtn" onclick="control('doors')">DOORS OFF</button>
                    </div>
                    <button class="wide ghost" onclick="control('reset')">RESET VIEW</button>
                </div>
            </section>

            <footer class="bottom">
                <button id="cleanBtn" class="clean" onclick="toggleClean()">HIDE UI / HUD (`)</button>
                <button class="close" onclick="closePanel()">CLOSE</button>
            </footer>

            <p id="hint" class="hint">Tasta ` ascunde/arata UI-ul, minimap-ul si HUD-ul. Escape inchide meniul.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
