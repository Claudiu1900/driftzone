<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone Emotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <div class="backdrop"></div>
        <div class="panel">
            <button class="close" onclick="closeMenu()">×</button>
            <header>
                <div>
                    <div class="kicker">DRIFTZONE</div>
                    <h1 id="title">Emotes</h1>
                    <p id="subtitle">Alege rapid animatia dorita</p>
                </div>
                <div class="counter"><b id="count">0</b><span>emotes</span></div>
            </header>
            <div class="search"><input id="searchInput" placeholder="Cauta emote dupa nume..." oninput="render()"></div>
            <nav id="categories" class="categories"></nav>
            <main id="grid" class="grid"></main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
