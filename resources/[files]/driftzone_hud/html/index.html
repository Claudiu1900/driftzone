<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hudRoot" class="hud-root hidden">
        <div class="date-time" id="dateTimeValue">28/05/2026 18:56</div>

        <div class="brand-row">
            <div class="brand-title">DRIFTZONE</div>
            <img id="logo" class="brand-logo" src="logo.png" alt="DriftZone">
        </div>

        <div class="stats-row">
            <div class="stat-number" id="onlineValue">850</div>

            <div class="blue-pill icon-pill">
                <svg viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </div>

            <div class="stat-number" id="timeValue">18:56</div>

            <div class="blue-pill icon-pill">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1.75A10.25 10.25 0 1 0 22.25 12 10.26 10.26 0 0 0 12 1.75Zm.75 10.05 4.15 2.47-.77 1.29-4.88-2.91V6.5h1.5Z"/>
                </svg>
            </div>

            <div class="blue-pill id-pill">
                <span id="idValue">#1602</span>
            </div>
        </div>

        <div class="cash-section">
            <div class="cash-left">
                <div class="cash-label">Bani Cash</div>
                <div id="cashValue" class="cash-value">$500</div>
            </div>

            <div class="blue-pill money-pill">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2a10 10 0 1 0 .01 0ZM13 17.4V19h-2v-1.55c-1.55-.25-2.79-1.03-3.47-2.28l1.74-1c.52.91 1.38 1.45 2.73 1.45 1.2 0 1.93-.43 1.93-1.18 0-.82-.7-1.05-2.45-1.48-1.88-.46-3.55-1.12-3.55-3.1 0-1.59 1.15-2.74 3.07-3.08V5h2v1.75c1.25.3 2.19.98 2.82 2l-1.7 1.02c-.43-.7-1.09-1.13-2.18-1.13-1.12 0-1.76.43-1.76 1.13 0 .75.62.99 2.28 1.38 2.03.49 3.77 1.16 3.77 3.24 0 1.73-1.21 2.72-3.23 3.01Z"/>
                </svg>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
