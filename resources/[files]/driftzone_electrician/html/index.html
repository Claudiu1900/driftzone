<!doctype html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Electrician</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="app" class="hidden" aria-hidden="true">
        <section class="device">
            <header class="topbar">
                <div class="brand">
                    <span class="brand-mark">⚡</span>
                    <div>
                        <strong>DRIFTZONE ELECTRIC</strong>
                        <small>Dispecerat interventii</small>
                    </div>
                </div>
                <div class="top-actions">
                    <span id="clock">00:00</span>
                    <button id="closeButton" class="icon-button" aria-label="Inchide">×</button>
                </div>
            </header>

            <nav id="tabs" class="tabs">
                <button data-view="company" class="tab active">Companie</button>
                <button data-view="tablet" class="tab">Tableta</button>
            </nav>

            <section id="content" class="content"></section>
        </section>
    </main>

    <section id="repair" class="repair-overlay hidden" aria-hidden="true">
        <div class="repair-card">
            <div class="repair-head">
                <span class="pulse"></span>
                <div>
                    <small>PROCEDURA DE SIGURANTA</small>
                    <h2 id="repairTitle">Stabilizare circuit</h2>
                </div>
                <span id="repairVoltage" class="voltage">Joasa tensiune</span>
            </div>

            <p class="repair-instruction">Apasa rapid punctele de avarie. Punctele ratate sunt inregistrate ca greseli.</p>
            <div id="repairField" class="repair-field">
                <div class="grid-lines"></div>
            </div>

            <div class="repair-status">
                <div>
                    <span>Progres interventie</span>
                    <strong id="repairPercent">0%</strong>
                </div>
                <div class="progress"><span id="repairProgress"></span></div>
                <div class="repair-meta">
                    <span>Greseli: <b id="mistakes">0</b></span>
                    <span>Permise: <b id="allowedMistakes">0</b></span>
                    <span>Timp: <b id="repairTime">0s</b></span>
                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
