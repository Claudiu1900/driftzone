<!doctype html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DriftZone Minimap HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="hud" class="hud is-hidden" aria-label="Status jucător">
        <section class="status-card health" data-card="health" aria-label="Viață">
            <div class="level"></div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20.4 3.8 12.7A5.35 5.35 0 0 1 11.4 5l.6.7.6-.7a5.35 5.35 0 0 1 7.6 7.7L12 20.4Z"/>
            </svg>
            <div class="reading"><span class="value">100</span><span class="percent">%</span></div>
            <span class="label">VIAȚĂ</span>
        </section>

        <section class="status-card armour" data-card="armour" aria-label="Armură">
            <div class="level"></div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.5 20 6v5.3c0 5.1-3.4 8.7-8 10.2-4.6-1.5-8-5.1-8-10.2V6l8-3.5Zm0 4.1-4.2 1.8v2.9c0 2.9 1.6 5.1 4.2 6.3 2.6-1.2 4.2-3.4 4.2-6.3V8.4L12 6.6Z"/>
            </svg>
            <div class="reading"><span class="value">0</span><span class="percent">%</span></div>
            <span class="label">ARMURĂ</span>
        </section>

        <section class="status-card food" data-card="food" aria-label="Mâncare">
            <div class="level"></div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 2v7.1a2.9 2.9 0 0 0 2 2.75V22H6.7V11.85a2.9 2.9 0 0 0 2-2.75V2H7Zm-3 0v6h1V2H4Zm2 0v6h1V2H6Zm7.3 0c3.1 0 5.2 2.7 5.2 6.1v4.2h-2V22h-2.3V2h-.9Z"/>
            </svg>
            <div class="reading"><span class="value">100</span><span class="percent">%</span></div>
            <span class="label">MÂNCARE</span>
        </section>

        <section class="status-card water" data-card="water" aria-label="Apă">
            <div class="level"></div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.2S5.4 9.6 5.4 14.4A6.6 6.6 0 0 0 12 21a6.6 6.6 0 0 0 6.6-6.6C18.6 9.6 12 2.2 12 2.2Zm0 15.9a3.7 3.7 0 0 1-3.7-3.7c0-.8.4-1.9 1.1-3.1.2 2.2 1.5 3.8 4.2 4.8-.4 1.2-.9 1.7-1.6 2Z"/>
            </svg>
            <div class="reading"><span class="value">100</span><span class="percent">%</span></div>
            <span class="label">APĂ</span>
        </section>

        <section class="status-card stamina" data-card="stamina" aria-label="Stamina">
            <div class="level"></div>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m13.4 2-8 11h5.2L9.9 22l8.7-12h-5.3l.1-8Z"/>
            </svg>
            <div class="reading"><span class="value">100</span><span class="percent">%</span></div>
            <span class="label">STAMINA</span>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
