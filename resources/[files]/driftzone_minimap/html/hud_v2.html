<!doctype html>
<html lang="ro" style="width:100%;height:100%;margin:0;background:transparent!important;overflow:hidden;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DriftZone HUD</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgba(0, 0, 0, 0) !important;
            background-color: transparent !important;
            font-family: Arial, "Segoe UI", sans-serif;
            pointer-events: none;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        #hud {
            position: fixed;
            left: 1.15vw;
            bottom: 0.75vh;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 220ms ease, transform 220ms ease, visibility 0s linear 0s;
        }

        #hud.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px) scale(0.98);
            transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
        }

        .status {
            position: relative;
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 9px;
            background: linear-gradient(145deg, rgba(8, 12, 18, 0.94), rgba(18, 23, 32, 0.90));
            box-shadow: 0 7px 17px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255,255,255,0.07);
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: width 230ms ease, flex-basis 230ms ease, margin 230ms ease, opacity 200ms ease, transform 230ms ease, border-width 230ms ease;
        }

        .status::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 45%);
        }

        .status.collapsed {
            width: 0;
            flex-basis: 0;
            margin-left: -6px;
            border-width: 0;
            opacity: 0;
            transform: translateY(9px) scale(0.82);
        }

        .fill {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            z-index: 0;
            background: transparent;
            box-shadow: none;
            transition: height 260ms cubic-bezier(.2,.75,.25,1);
        }

        .wave {
            position: absolute;
            left: -120px;
            top: -7px;
            width: 360px;
            height: 14px;
            opacity: 0.72;
            background-image:
                radial-gradient(circle at 20px 10px, rgba(255,255,255,0.34) 0 12px, transparent 13px),
                radial-gradient(circle at 58px 4px, rgba(255,255,255,0.18) 0 10px, transparent 11px),
                radial-gradient(circle at 96px 10px, rgba(255,255,255,0.30) 0 12px, transparent 13px);
            background-size: 120px 14px;
            background-repeat: repeat-x;
            animation: wave 2.8s linear infinite;
        }

        .shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 42%);
        }

        .icon {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 13px;
            height: 13px;
            z-index: 3;
            fill: rgba(255,255,255,0.96);
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.38));
        }

        .reading {
            position: absolute;
            inset: 11px 4px 12px;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1px;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.75);
        }

        .number {
            font-size: 16px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.45px;
        }

        .percent {
            margin-top: 2px;
            font-size: 7px;
            line-height: 1;
            font-weight: 900;
        }

        .label {
            position: absolute;
            left: 2px;
            right: 2px;
            bottom: 3px;
            z-index: 3;
            overflow: hidden;
            color: rgba(255,255,255,0.91);
            font-size: 6px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0,0,0,0.7);
        }

        .critical {
            animation: critical 900ms ease-in-out infinite;
        }

        .health {
            border-color: rgba(255,74,94,0.76);
            box-shadow: 0 7px 17px rgba(0,0,0,0.34), 0 0 12px rgba(255,74,94,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .health .fill {
            background: linear-gradient(180deg, rgba(255,74,94,0.48), rgba(255,74,94,0.95));
            box-shadow: 0 -5px 14px rgba(255,74,94,0.25);
        }
        .health .reading { color: rgb(255,92,109); }

        .armour {
            border-color: rgba(67,187,255,0.76);
            box-shadow: 0 7px 17px rgba(0,0,0,0.34), 0 0 12px rgba(67,187,255,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .armour .fill {
            background: linear-gradient(180deg, rgba(67,187,255,0.48), rgba(67,187,255,0.95));
            box-shadow: 0 -5px 14px rgba(67,187,255,0.25);
        }
        .armour .reading { color: rgb(82,195,255); }

        .food {
            border-color: rgba(255,158,61,0.76);
            box-shadow: 0 7px 17px rgba(0,0,0,0.34), 0 0 12px rgba(255,158,61,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .food .fill {
            background: linear-gradient(180deg, rgba(255,158,61,0.48), rgba(255,158,61,0.95));
            box-shadow: 0 -5px 14px rgba(255,158,61,0.25);
        }
        .food .reading { color: rgb(255,171,84); }

        .water {
            border-color: rgba(50,139,255,0.76);
            box-shadow: 0 7px 17px rgba(0,0,0,0.34), 0 0 12px rgba(50,139,255,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .water .fill {
            background: linear-gradient(180deg, rgba(50,139,255,0.48), rgba(50,139,255,0.95));
            box-shadow: 0 -5px 14px rgba(50,139,255,0.25);
        }
        .water .reading { color: rgb(73,153,255); }

        .stamina {
            border-color: rgba(185,234,65,0.76);
            box-shadow: 0 7px 17px rgba(0,0,0,0.34), 0 0 12px rgba(185,234,65,0.25), inset 0 1px 0 rgba(255,255,255,0.07);
        }
        .stamina .fill {
            background: linear-gradient(180deg, rgba(185,234,65,0.48), rgba(185,234,65,0.95));
            box-shadow: 0 -5px 14px rgba(185,234,65,0.25);
        }
        .stamina .reading { color: rgb(198,241,88); }

        @keyframes wave {
            from { transform: translateX(0); }
            to { transform: translateX(120px); }
        }

        @keyframes critical {
            0%,100% { filter: brightness(1); }
            50% { filter: brightness(1.16); }
        }

        @media (max-width: 1366px) {
            #hud { gap: 5px; }
            .status { width: 48px; height: 48px; flex-basis: 48px; }
            .status.collapsed { margin-left: -5px; }
            .number { font-size: 15px; }
        }
    </style>
</head>
<body style="background:transparent!important;background-color:rgba(0,0,0,0)!important;">
    <main id="hud" class="hidden">
        <section class="status health" data-card="health">
            <div class="fill"><div class="wave"></div><div class="shine"></div></div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 20.4 3.8 12.7A5.35 5.35 0 0 1 11.4 5l.6.7.6-.7a5.35 5.35 0 0 1 7.6 7.7L12 20.4Z"/></svg>
            <div class="reading"><span class="number">100</span><span class="percent">%</span></div>
            <span class="label">VIAȚĂ</span>
        </section>

        <section class="status armour collapsed" data-card="armour">
            <div class="fill"><div class="wave"></div><div class="shine"></div></div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.5 20 6v5.3c0 5.1-3.4 8.7-8 10.2-4.6-1.5-8-5.1-8-10.2V6l8-3.5Zm0 4.1-4.2 1.8v2.9c0 2.9 1.6 5.1 4.2 6.3 2.6-1.2 4.2-3.4 4.2-6.3V8.4L12 6.6Z"/></svg>
            <div class="reading"><span class="number">0</span><span class="percent">%</span></div>
            <span class="label">ARMURĂ</span>
        </section>

        <section class="status food" data-card="food">
            <div class="fill"><div class="wave"></div><div class="shine"></div></div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M7 2v7.1a2.9 2.9 0 0 0 2 2.75V22H6.7V11.85a2.9 2.9 0 0 0 2-2.75V2H7Zm-3 0v6h1V2H4Zm2 0v6h1V2H6Zm7.3 0c3.1 0 5.2 2.7 5.2 6.1v4.2h-2V22h-2.3V2h-.9Z"/></svg>
            <div class="reading"><span class="number">100</span><span class="percent">%</span></div>
            <span class="label">MÂNCARE</span>
        </section>

        <section class="status water" data-card="water">
            <div class="fill"><div class="wave"></div><div class="shine"></div></div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2.2S5.4 9.6 5.4 14.4A6.6 6.6 0 0 0 12 21a6.6 6.6 0 0 0 6.6-6.6C18.6 9.6 12 2.2 12 2.2Zm0 15.9a3.7 3.7 0 0 1-3.7-3.7c0-.8.4-1.9 1.1-3.1.2 2.2 1.5 3.8 4.2 4.8-.4 1.2-.9 1.7-1.6 2Z"/></svg>
            <div class="reading"><span class="number">100</span><span class="percent">%</span></div>
            <span class="label">APĂ</span>
        </section>

        <section class="status stamina collapsed" data-card="stamina">
            <div class="fill"><div class="wave"></div><div class="shine"></div></div>
            <svg class="icon" viewBox="0 0 24 24"><path d="m13.4 2-8 11h5.2L9.9 22l8.7-12h-5.3l.1-8Z"/></svg>
            <div class="reading"><span class="number">100</span><span class="percent">%</span></div>
            <span class="label">STAMINA</span>
        </section>
    </main>

    <script>
        'use strict';

        document.documentElement.style.background = 'transparent';
        document.body.style.background = 'transparent';

        const hud = document.getElementById('hud');
        const cards = Object.create(null);

        document.querySelectorAll('[data-card]').forEach((element) => {
            cards[element.dataset.card] = {
                root: element,
                fill: element.querySelector('.fill'),
                number: element.querySelector('.number')
            };
        });

        function clamp(value) {
            const number = Number(value);
            if (!Number.isFinite(number)) return 0;
            return Math.max(0, Math.min(100, Math.round(number)));
        }

        function updateCard(name, value) {
            const card = cards[name];
            if (!card) return;

            const safeValue = clamp(value);
            card.number.textContent = String(safeValue);
            card.fill.style.height = safeValue + '%';
            card.root.classList.toggle('critical', safeValue <= 15);
        }

        function setCollapsed(name, collapsed) {
            const card = cards[name];
            if (!card) return;
            card.root.classList.toggle('collapsed', Boolean(collapsed));
        }

        function updateHud(data) {
            data = data || {};
            const visible = data.visible === true;
            hud.classList.toggle('hidden', !visible);
            if (!visible) return;

            updateCard('health', data.health);
            updateCard('armour', data.armour);
            updateCard('food', data.food);
            updateCard('water', data.water);
            updateCard('stamina', data.stamina);

            setCollapsed('armour', data.showArmour !== true);
            setCollapsed('stamina', data.showStamina !== true);
        }

        window.addEventListener('message', (event) => {
            const message = event.data;
            if (!message || message.action !== 'update') return;
            updateHud(message.data);
        });
    </script>
</body>
</html>
