<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriftZone Tickets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="counter" class="counter hidden">
        <span class="counter-ring"></span>
        <span class="counter-title">Tickets</span>
        <b id="ticketCount">0</b>
    </div>

    <div id="overlay" class="overlay hidden">
        <div class="mesh"></div>
        <div class="scan"></div>
        <div class="beam beam-a"></div>
        <div class="beam beam-b"></div>
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>

        <div class="terminal">
            <main class="workspace">
                <button class="close" onclick="closeAll()" aria-label="Close">
                    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>

                <section id="userPanel" class="panel user-panel hidden">
                    <div class="panel-top">
                        <div class="panel-icon pulse-icon">
                            <svg viewBox="0 0 64 64">
                                <path d="M14 21h36a4 4 0 0 1 4 4v5a6 6 0 0 0 0 12v5a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4v-5a6 6 0 0 0 0-12v-5a4 4 0 0 1 4-4Z" fill="none" stroke="currentColor" stroke-width="3"/>
                                <path d="M26 21v30M36 31h10M36 40h8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div>
                            <p class="kicker">Player Request</p>
                            <h1>Create Ticket</h1>
                            <span>Scrie problema clar. Staff-ul o vede instant in panel.</span>
                        </div>
                    </div>

                    <div class="form-grid">
                        <label class="field">
                            <span>Titlu</span>
                            <input id="ticketTitle" maxlength="80" placeholder="Ex: Am nevoie de ajutor la garaj">
                        </label>

                        <label class="field field-big">
                            <span>Subiect</span>
                            <textarea id="ticketSubject" maxlength="500" placeholder="Descrie problema exact, unde esti si ce s-a intamplat..."></textarea>
                        </label>
                    </div>

                    <div id="userError" class="error"></div>

                    <div class="footer-actions">
                        <button class="ghost-btn" onclick="closeAll()">Cancel</button>
                        <button class="main-btn" onclick="createTicket()">
                            <span>Create ticket</span>
                            <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                </section>

                <section id="adminPanel" class="panel admin-panel hidden">
                    <div class="admin-header">
                        <div class="panel-top admin-title-wrap">
                            <div class="panel-icon shield">
                                <svg viewBox="0 0 64 64">
                                    <path d="M32 6 54 16v15c0 14-8.8 23-22 27C18.8 54 10 45 10 31V16L32 6Z" fill="none" stroke="currentColor" stroke-width="3"/>
                                    <path d="m22 33 7 7 15-17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                            <div>
                                <p class="kicker">Staff Control</p>
                                <h1>Active Tickets</h1>
                                <span>Accept inchide meniul automat si te teleporteaza la player.</span>
                            </div>
                        </div>

                        <div class="admin-tools">
                            <div class="admin-count">
                                <span>Queue</span>
                                <b id="adminTicketCount">0</b>
                            </div>
                            <div class="search-box">
                                <svg viewBox="0 0 24 24"><path d="M10.5 18a7.5 7.5 0 1 1 5.3-12.8A7.5 7.5 0 0 1 10.5 18ZM16 16l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                                <input id="ticketSearch" placeholder="Search ticket / UID / nume">
                            </div>
                        </div>
                    </div>

                    <div id="ticketsList" class="tickets-list"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
