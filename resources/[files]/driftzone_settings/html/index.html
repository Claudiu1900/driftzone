<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="grid"></div>
        <div class="scanlines"></div>
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>

        <div class="shell">
            <aside class="side">
                <div class="brand">
                    <div class="brandIcon">
                        <svg viewBox="0 0 64 64">
                            <path d="M32 6l22 13v26L32 58 10 45V19L32 6z" fill="none" stroke="currentColor" stroke-width="3"/>
                            <path d="M22 32h20M32 22v20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            <path d="M20 18l12-7 12 7" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/>
                        </svg>
                    </div>
                    <div>
                        <div class="brandTitle">DriftZone</div>
                        <div class="brandSub">Client Settings</div>
                    </div>
                </div>

                <div class="sideCard">
                    <span class="kicker">Active Profile</span>
                    <h2>Visual Core</h2>
                    <p>Setari locale pentru HUD, radar si overhead stats. Se salveaza automat pe client.</p>
                </div>

                <div class="nav" id="categoryList"></div>

                <button class="reset" onclick="resetSettings()">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 12a8 8 0 1 0 2.34-5.66M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Reset
                </button>
            </aside>

            <main class="main">
                <button class="close" onclick="closeSettings()">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>
                </button>

                <header class="header">
                    <div>
                        <span class="kicker">DriftZone Control Panel</span>
                        <h1>Settings</h1>
                        <p>Controleaza rapid elementele vizuale importante ale serverului.</p>
                    </div>

                    <div class="status">
                        <span></span>
                        LIVE
                    </div>
                </header>

                <section class="summary">
                    <div>
                        <b id="enabledCount">0</b>
                        <span>Enabled</span>
                    </div>
                    <div>
                        <b id="disabledCount">0</b>
                        <span>Disabled</span>
                    </div>
                    <div>
                        <b id="totalCount">0</b>
                        <span>Total Toggles</span>
                    </div>
                </section>

                <section id="settingsList" class="settingsList"></section>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
