<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>DriftZone Showroom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root" class="root hidden">
        <div class="top-glow"></div>

        <div class="top-modes">
            <button class="mode-btn active" data-mode="DRIFT" onclick="selectMode('DRIFT')">DRIFT</button>
            <button class="mode-btn" data-mode="HS" onclick="selectMode('HS')">HS</button>
            <button class="mode-btn premium" data-mode="PREMIUM" onclick="selectMode('PREMIUM')">PREMIUM</button>
            <button class="mode-btn custom" data-mode="CUSTOM" onclick="selectMode('CUSTOM')">CUSTOM</button>
        </div>

        <div class="left-info">
            <div class="brand-row">
                <div class="logo">DZ</div>
                <div>
                    <h1>DRIFTZONE SHOWROOM</h1>
                    <p>Premium drift vehicle dealership</p>
                </div>
            </div>

            <div class="selected-box">
                <span class="tag">SELECTED VEHICLE</span>
                <h2 id="selectedName">Vehicle</h2>
                <p id="selectedCategory">Category</p>

                <div id="selectedPrice" class="price">$0</div>
                <div class="wallet-row">
                    <span id="walletCash">Cash: $0</span>
                    <span id="walletCoins">DZC: 0</span>
                </div>

                <div class="actions">
                    <button id="buyBtn" class="buy-btn" onclick="buySelected()">BUY VEHICLE</button>
                    <button id="testBtn" class="test-btn" onclick="testDriveSelected()">TEST DRIVE</button>
                </div>

                <div class="tips">
                    ESC inchide • ` camera libera • click + drag pe masina ca sa o rotesti
                </div>
            </div>
        </div>

        <div class="right-categories">
            <div id="subcategories" class="subcategories"></div>
        </div>

        <div class="bottom-list">
            <div class="list-head">
                <b id="listTitle">DRIFT • ALL</b>
                <span id="vehicleCount">0 vehicles</span>
            </div>

            <div id="vehicles" class="vehicles"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
